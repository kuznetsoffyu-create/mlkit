name: Build vision-quickstart APK

on:
  push:
    branches: [ master ]   # проверьте, что ветка форка называется именно так
  workflow_dispatch:        # позволяет запускать вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/vision-quickstart
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: List built APKs
        run: find . -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vision-quickstart-debug
          path: android/vision-quickstart/app/build/outputs/apk/debug/*.apk
